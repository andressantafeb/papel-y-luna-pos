<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Punto de venta de Papel y Luna">
  <meta name="theme-color" content="#14231c">
  <title>Papel y Luna · POS</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <!-- Tipografía de la identidad visual (geométrica, tipo Plus Jakarta Sans). Sin internet se usa la fuente del sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/extra.css">
</head>
<body>
  <!-- Pantalla de inicio de sesión (la pinta js/vistas/login.js) -->
  <div id="pantalla-login" class="login-pantalla oculto"></div>

  <!-- Aplicación autenticada: el menú depende del rol (js/app.js) -->
  <div id="app" class="oculto">
    <header class="app-header">
      <!-- Hamburguesa: solo en móvil. Abre el panel lateral (#nav), que arma js/app.js -->
      <button id="btn-menu" type="button" class="btn-menu" aria-label="Abrir menú" aria-controls="nav" aria-expanded="false"></button>
      <div class="brand">
        <img src="img/logo.png" alt="Papel y Luna" class="logo">
        <div><strong>Papel y Luna</strong><span>Punto de venta</span></div>
      </div>
      <nav id="nav" class="nav-principal" aria-label="Módulos principales"></nav>
      <div id="nav-backdrop" class="nav-backdrop"></div>
      <div class="user-box">
        <span id="usuario-info"></span>
        <button id="btn-salir" type="button" class="boton secundario btn-salir">Salir</button>
      </div>
    </header>
    <main id="contenido"></main>
    <footer><span>Papel y Luna · POS MVP 3</span></footer>
  </div>

  <div id="toast" class="toast oculto" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
